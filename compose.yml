name: "log"

x-lockdown: &lockdown
  # prevents write access to the image itself
  read_only: true
  # prevents any process within the container to gain more privileges
  security_opt:
    - "no-new-privileges=true"

services:
  opentelemetry-collector:
    image: "11notes/opentelemetry-collector:0.159.0"
    <<: *lockdown
    environment:
      TZ: "Europe/Zurich"
      HEC_TOKEN: "${HEC_TOKEN}"
      HEC_URL: "${HEC_URL}"
    volumes:
      - "opentelemetry-collector.etc:/opentelemetry-collector/etc"
    ports:
      - "5140:5140/udp"
      - "5140:5140/tcp"
    networks:
      frontend:
    restart: "always"

volumes:
  opentelemetry-collector.etc:

networks:
  frontend: